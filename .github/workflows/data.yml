name: Validate game data
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tools/validate_data.py
      - run: python tools/test_validate_data.py
      - run: python tools/build_datatable.py
      - run: python tools/build_market.py
